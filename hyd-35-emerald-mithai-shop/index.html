<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refreshing — Kerblabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F5EDDE;color:#3E2B20;font:400 16px/1.6 "Inter",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;}
  .wrap{max-width:520px;text-align:center;}
  h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,6vw,64px);line-height:1.05;letter-spacing:-0.012em;margin:0 0 22px;color:#3E2B20;}
  h1 em{font-style:italic;color:#7F4730;font-weight:500;}
  p{margin:0 0 10px;color:#5A4232;font-size:17px;}
  .meta{margin-top:34px;color:#8A7765;font-size:11px;letter-spacing:0.30em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Refreshing<em>.</em></h1>
  <p>Your preview is being re-cut with fresh footage.</p>
  <p>Back live in a few hours.</p>
  <div class="meta">Kerblabs &middot; site refresh</div>
</div>
</body>
</html>
