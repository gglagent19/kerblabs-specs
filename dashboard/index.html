.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin:24px 0}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
.panel h2{font-size:14px;margin:0 0 16px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
td.r,th.r{text-align:right}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-NEW{background:rgba(91,157,255,.15);color:var(--blue)}
.b-EMAILED{background:rgba(231,201,138,.15);color:var(--gold)}
.b-IG_SENT{background:rgba(176,140,255,.15);color:var(--purple)}
.b-WA_SENT{background:rgba(45,212,167,.15);color:var(--accent)}
.b-REPLIED{background:rgba(45,212,167,.22);color:var(--accent)}
.b-CLOSED{background:var(--accent);color:#04231a}
.b-NO_EMAIL,.b-PENDING{background:rgba(138,152,176,.15);color:var(--mut)}
.b-BUILT{background:rgba(91,157,255,.12);color:var(--blue)}
.yes{color:var(--accent);font-weight:700}.no{color:#3c4а5c;color:#3c4a5c}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px}
input{flex:1;min-width:200px}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.funnel{display:flex;align-items:stretch;gap:8px}
.fstep{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.fstep .n{font-size:24px;font-weight:800}.fstep .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.fstep .cap{font-size:10px;color:var(--mut);margin-top:6px}
.muted{color:var(--mut)}
#map{height:480px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.maplegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px}
.maplegend .it{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink)}
.maplegend .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px -1px currentColor}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111a2e;color:#eef2f8}
.leaflet-popup-content{font:13px Inter,sans-serif}.leaflet-container{background:#0b1220}

   L.circleMarker([m.lat,m.lon],{radius:7+Math.sqrt(m.prospects)*2.2,color:m.color,weight:2,fillColor:m.color,fillOpacity:.5})
    .addTo(map).bindPopup(`<b>${m.category}</b><br>${m.city}<br>${m.prospects} sites · ${m.emailed} emailed`);
 });
 $('#maplegend').innerHTML=Object.entries(D.catColors).map(([k,c])=>`<div class=it><span class=dot style="background:${c};color:${c}"></span>${k}</div>`).join('');
 setTimeout(()=>map.invalidateSize(),250);
}catch(e){$('#map').innerHTML='<div class=muted style=padding:20px>map needs internet to load tiles</div>';}
function render(){
 const q=$('#q').value.toLowerCase(),fv=$('#fv').value,fs=$('#fs').value;
 const f=D.rows.filter(r=>(!q||r.name.toLowerCase().includes(q))&&(!fv||r.vertical===fv)&&(!fs||r.stage===fs));
 $('#cnt').textContent=f.length+" shown";
 const chk=(d)=>d?`<span class=yes title="${d}">✓</span>`:`<span class=no>—</span>`;
 $('#pt tbody').innerHTML=f.slice(0,400).map(r=>`<tr>
 <td>${r.name}</td><td class=muted>${r.vertical}</td>
 <td><span class="badge b-${r.stage}">${r.stage}</span></td>
 <td class=r>${chk(r.email_date)}</td><td class=r>${chk(r.ig_date)}</td><td class=r>${chk(r.wa_date)}</td>
 <td class=muted>${r.phone||""}</td>
 <td>${r.site?`<a href="${r.site}" target=_blank>view ↗</a>`:'<span class=muted>—</span>'}</td></tr>`).join("");
}
$('#q').oninput=render;$('#fv').onchange=render;$('#fs').onchange=render;render();
</script></body></html>
